[package]
name = "starlite"
version = "0.3.3"
edition = "2021"
description = "Starlite - a liquid-glass music player"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["svg", "image", "http", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
tiny-skia = "0.11"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-flac", "symphonia-wav", "symphonia-vorbis", "symphonia-aac", "symphonia-isomp4", "symphonia-alac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
rfd = "0.15"
wry = "0.57"
sha2 = "0.10"
md-5 = "0.10"
discord-rich-presence = "1.1"
getrandom = "0.2"
lofty = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"

[build-dependencies]
winresource = "0.1"
