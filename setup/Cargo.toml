[package]
name = "starlite-setup"
version = "0.3.5"
edition = "2021"
description = "Starlite Setup"
publish = false

# Built on its own (not part of the app's build): see docs/DEVELOPMENT.md.
[workspace]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
